name: Backend tests
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acervovivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d acervovivo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/acervovivo_test
      APP_SECRET_KEY: github-actions-test-secret-key-at-least-32-characters-long
      BOOTSTRAP_LIBRARIAN_NAME: Test Admin
      BOOTSTRAP_LIBRARIAN_EMAIL: admin@example.com
      BOOTSTRAP_LIBRARIAN_PASSWORD: Test-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
