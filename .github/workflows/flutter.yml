name: Flutter checks

on:
  push:
    paths:
      - "app_flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "app_flutter/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test
