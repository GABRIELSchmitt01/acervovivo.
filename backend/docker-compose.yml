services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acervovivo}
      POSTGRES_USER: ${POSTGRES_USER:-acervovivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acervovivo} -d ${POSTGRES_DB:-acervovivo}"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-acervovivo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-acervovivo}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Configure APP_SECRET_KEY no .env}
      BOOTSTRAP_LIBRARIAN_NAME: ${BOOTSTRAP_LIBRARIAN_NAME:-Bibliotecário}
      BOOTSTRAP_LIBRARIAN_EMAIL: ${BOOTSTRAP_LIBRARIAN_EMAIL:?Configure e-mail inicial}
      BOOTSTRAP_LIBRARIAN_PASSWORD: ${BOOTSTRAP_LIBRARIAN_PASSWORD:?Configure senha inicial}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend_net]
volumes:
  postgres_data:
networks:
  backend_net:
    driver: bridge
